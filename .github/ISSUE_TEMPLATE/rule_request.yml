name: 新增应用或场景规则
description: 为真实遇到的新应用或新页面申请规则
title: '[规则适配] '
body:
  - type: markdown
    attributes:
      value: |
        请先查看应用内已有规则及其开关，再提供待适配页面的 GKD 快照。
        快照图片和控件文字可能包含个人信息，请检查后再公开提交。
  - type: input
    id: app
    attributes:
      label: 应用名称、版本与包名
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: GKD 版本与手机系统
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 页面出现方式与预期动作
      description: 说明进入步骤、需要点击的目标，以及是否存在相似的正常按钮。
    validations:
      required: true
  - type: textarea
    id: snapshots
    attributes:
      label: 页面快照
      description: 提供快照 ZIP 或 https://i.gkd.li/i/ 分享链接。多步流程分别提供每一步。
    validations:
      required: true
